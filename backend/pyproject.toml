[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowstart"
version = "0.1.0"
description = "Slow Start: TCP-style goals for lazy people, with a pixel-art giant to look after"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
# TabPFN v2 runs on CPU torch. CI and most tests use a fake predictor and skip this extra.
model = ["tabpfn>=2.5", "torch"]
dev = ["pytest>=8", "ruff>=0.6", "psutil"]

[tool.setuptools.packages.find]
include = ["slowstart*"]

[tool.setuptools.package-data]
slowstart = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
