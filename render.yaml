# Render Blueprint: https://render.com/docs/blueprint-spec
#
#   slowstart         the app and the API in one container: Python, TabPFN v2 on CPU, the built game
#   slowstart-ollama  private Ollama server with gemma3:1b baked in (reads check-ins, speaks as the giant)
#
# Both must be in the same region to reach each other privately.
# slowstart needs about 1 GB at run time (TabPFN v2 plus torch measured 584 MB at peak), so the 512 MB
# plans are too small and `standard` (2 GB) is the smallest that fits. The model service is optional:
# without it check-ins fall back to templates and nothing else changes.
services:
  - type: web
    name: slowstart
    runtime: docker
    region: singapore
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SS_MODEL
        value: gemma3:1b
      - key: SS_LLM_TIMEOUT_S
        value: "90"
      # One thread per CPU of the Ollama service.
      - key: SS_LLM_NUM_THREAD
        value: "1"
      - key: SS_OLLAMA_URL
        fromService:
          type: pserv
          name: slowstart-ollama
          property: hostport

  - type: pserv
    name: slowstart-ollama
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./ollama/Dockerfile
    dockerContext: ./ollama
    envVars:
      # Tells Render which port Ollama listens on. Without it the hostport that slowstart's
      # SS_OLLAMA_URL is built from defaults to 10000 and every model call is refused.
      - key: PORT
        value: "11434"
